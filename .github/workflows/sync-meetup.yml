name: Sync events

# Pulls events from member groups' Meetup.com calendars into the site: online
# "Global C++" sessions become _events/*.md pages; in-person member-group meetups
# become links in _data/group_events.yml. Then fills in `video:` links from the
# GlobalCpp YouTube channel. Runs weekly (and on demand), then commits any
# changes back to main so the built-in GitHub Pages build serves them. The bot's
# commit to _events/** in turn triggers generate-ics.yml, which refreshes
# events.ics — this workflow itself only runs on schedule/dispatch, so there is
# no loop.
#
# Three passes, because each sees something the others cannot:
#   1. the normal pass picks up *upcoming* events;
#   2. the catch-up pass creates pages/links for events that already happened,
#      so a week this workflow did not run (or ran before an event was posted)
#      is not lost forever;
#   3. the YouTube pass links recordings, which only exist after the talk.
#
# Requires repo secrets (Settings → Secrets and variables → Actions):
#   MEETUP_CLIENT_KEY      MEETUP_MEMBER_ID
#   MEETUP_SIGNING_KEY_ID  MEETUP_PRIVATE_KEY   (the RSA private-key PEM contents)
# and repo Actions write permission (Settings → Actions → Workflow permissions).

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"

      # The env block is repeated per step on purpose: GitHub Actions does not
      # support YAML anchors, so it cannot be shared.
      - name: Sync upcoming events from Meetup
        env:
          MEETUP_CLIENT_KEY: ${{ secrets.MEETUP_CLIENT_KEY }}
          MEETUP_MEMBER_ID: ${{ secrets.MEETUP_MEMBER_ID }}
          MEETUP_SIGNING_KEY_ID: ${{ secrets.MEETUP_SIGNING_KEY_ID }}
          MEETUP_PRIVATE_KEY: ${{ secrets.MEETUP_PRIVATE_KEY }}
        run: ruby scripts/sync_meetup.rb

      - name: Catch up on past events the sync missed
        env:
          MEETUP_CLIENT_KEY: ${{ secrets.MEETUP_CLIENT_KEY }}
          MEETUP_MEMBER_ID: ${{ secrets.MEETUP_MEMBER_ID }}
          MEETUP_SIGNING_KEY_ID: ${{ secrets.MEETUP_SIGNING_KEY_ID }}
          MEETUP_PRIVATE_KEY: ${{ secrets.MEETUP_PRIVATE_KEY }}
        run: ruby scripts/sync_meetup.rb --past

      # Needs no secrets (the uploads feed is public), so it still runs when the
      # Meetup steps fail on credentials.
      - name: Fill video links from YouTube
        if: always()
        run: ruby scripts/sync_youtube.rb

      - name: Commit synced events
        if: always()
        run: |
          if [ -n "$(git status --porcelain _events _data/group_events.yml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _events _data/group_events.yml
            git commit -m "Sync events [skip ci]"
            git push
          else
            echo "No changes to sync."
          fi
